<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدولي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3fa;--card:#fff;--c2:#eceefa;--ink:#161a36;--mut:#6b7194;--ln:#e1e4f2;--a:#5b5bd6;--bad:#d1344b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1224;--card:#191d38;--c2:#222747;--ink:#eef0ff;--mut:#9aa1c9;--ln:#2a3058}}
:root[data-theme=dark]{--bg:#0f1224;--card:#191d38;--c2:#222747;--ink:#eef0ff;--mut:#9aa1c9;--ln:#2a3058}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Roboto,Tahoma,sans-serif;padding-bottom:96px}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 6px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
header>div{flex:1}header h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.3px}#sub{color:var(--mut);font-size:13px;margin-top:2px}
button,select,input{font:inherit;color:inherit}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--ln);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;font-weight:600}
.btn.g{background:var(--c2);color:var(--ink)}.btn.d{background:var(--bad)}
.wrap{padding:8px 10px;max-width:900px;margin:auto}
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:5px;width:100%;min-width:640px}
th,td{padding:0;text-align:center;font-size:12px;height:64px;min-width:84px;vertical-align:top}
th{height:34px;font-weight:600;color:var(--mut);vertical-align:middle}
th.today{color:var(--a);font-weight:700}
td{background:var(--card);border-radius:14px;padding:3px}
td.today{background:color-mix(in srgb,var(--a) 9%,var(--card))}
td.t{position:sticky;inset-inline-start:0;z-index:1;background:var(--bg);color:var(--ink);font-size:12px;font-weight:600;min-width:62px;vertical-align:middle}td.t.today{color:var(--a)}
.c{background:var(--cc,var(--a));color:#fff;border-radius:11px;padding:7px 4px;cursor:pointer;font-weight:600;line-height:1.3;min-height:100%;margin-bottom:3px}
.c small{display:block;font-weight:400;opacity:.9;margin-top:2px}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;width:58px;height:58px;border-radius:20px;border:0;background:var(--a);color:#fff;font-size:30px;box-shadow:0 8px 22px color-mix(in srgb,var(--a) 45%,transparent);cursor:pointer;z-index:6}
nav{position:fixed;bottom:10px;inset-inline:16px;display:flex;gap:6px;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:6px;z-index:6;margin-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:11px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:14px}
nav button.on{color:#fff;background:var(--a)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1.5px solid transparent;border-radius:12px;background:var(--c2)}
input:focus,select:focus{outline:0;border-color:var(--a)}
input[type=checkbox]{width:auto}
#m{position:fixed;inset:0;background:#0008;display:none;z-index:20;align-items:flex-end;justify-content:center}
#m.on{display:flex}
#mb{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#mb:before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
#mb h2{margin:0 0 6px;font-size:20px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);outline:2px solid transparent;cursor:pointer}.sw.on{outline-color:var(--ink)}
#toast{position:fixed;top:78px;inset-inline:14px;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:16px;z-index:30;display:none;font-weight:600}
#toast.bad{background:var(--bad);color:#fff}
.mut{color:var(--mut);font-size:13px}.lec{background:var(--c2);border-radius:14px;padding:4px 12px 10px;margin-top:10px}.lec input,.lec select{background:var(--card)}
.ex{display:flex;justify-content:space-between;gap:8px;align-items:center}
h3{font-size:15px;color:var(--a)}
#sp{position:fixed;inset:0;z-index:100;background:#0d0f24;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;overflow:hidden}
#sp.out{opacity:0;pointer-events:none}
#sp .web{position:absolute;inset:0;width:100%;height:100%}
#sp .web path{fill:none;stroke:#fff;stroke-opacity:.32;stroke-width:.25;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.2s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.lg{width:132px;height:132px;position:relative;z-index:2;animation:mun .25s 2.9s 2,eat .7s 3.4s ease-in forwards}
@keyframes mun{50%{transform:scale(.88)}}@keyframes eat{to{transform:scale(0) rotate(40deg);opacity:0}}
.spw{position:absolute;top:0;left:50%;z-index:3;font-size:46px;line-height:1;transform:translate(-50%,-70vh);animation:drop 1.4s 1.5s cubic-bezier(.3,.7,.3,1) forwards,rise 1s 4.2s ease-in forwards}
.spw:before{content:"";position:absolute;left:50%;bottom:100%;width:1.5px;height:100vh;background:#ffffff66}
@keyframes drop{to{transform:translate(-50%,calc(50vh - 75px))}}
@keyframes rise{from{transform:translate(-50%,calc(50vh - 75px))}to{transform:translate(-50%,-70vh)}}
#spt{opacity:0;font-size:34px;margin:18px 0 0;font-weight:700;position:relative;z-index:2;animation:fi .8s 4s forwards}
#spc{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));margin:0;font-size:14px;opacity:0;animation:fi .8s 4.3s forwards}
@keyframes fi{to{opacity:.9}}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx .web{position:absolute;top:-22vmin;inset-inline-end:-22vmin;width:80vmin;height:80vmin}
#fx .web path{fill:none;stroke:var(--a);stroke-opacity:.16;stroke-width:.3}
#fx .dg{position:absolute;top:78px;inset-inline-start:16%;font-size:24px;line-height:1;transform-origin:50% -78px;animation:sw 5s ease-in-out infinite}
#fx .dg i{position:absolute;left:50%;bottom:100%;width:1px;height:78px;background:var(--mut);opacity:.45}
@keyframes sw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.wrap{position:relative;z-index:1}
.tp{display:flex;align-items:center;gap:4px;background:var(--c2);border-radius:14px;padding:4px}
.tp select{appearance:none;-webkit-appearance:none;width:auto;flex:1;min-width:0;text-align:center;padding:9px 2px;border-radius:10px;background:var(--card);font-weight:600}
.tp b{color:var(--mut)}.ap{display:flex;background:var(--card);border-radius:10px;overflow:hidden}
.ap button{border:0;background:none;padding:9px 11px;font-weight:600;color:var(--mut);cursor:pointer}.ap button.on{background:var(--a);color:#fff}
.cr{border-inline-start:5px solid var(--cc);cursor:pointer}th.tc span{font-weight:400;font-size:11px}
details{margin-top:8px}summary{cursor:pointer}
</style>
</head>

<div id="m" onclick="if(event.target==this)cl()"><div id="mb"></div></div>
<div id="toast"></div>
<script>
const DN=[["السبت","Sat"],["الأحد","Sun"],["الاثنين","Mon"],["الثلاثاء","Tue"],["الأربعاء","Wed"],["الخميس","Thu"],["الجمعة","Fri"]];
const COL=["#5b5bd6","#0e9f8e","#e0457b","#f08a24","#2f7de1","#475569"];const PAL=["#5b5bd6","#0e9f8e","#e0457b","#f08a24","#2f7de1","#9b51e0","#d1495b","#2a9d8f"];const cc=x=>{let h=0;for(const ch of x.name)h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const DEF={lang:"ar",color:COL[0],theme:"auto",days:[0,1,2,3,4,5],slots:[["08:30","10:00"],["10:00","11:30"],["11:30","13:00"],["13:00","14:30"],["14:30","16:00"],["16:00","17:30"],["17:30","19:00"]],courses:[],exams:[],notif:{on:false,min:30},fx:true};
let S=JSON.parse(JSON.stringify(DEF)),view="tt";
try{const x=localStorage.getItem("jadwali");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("jadwali",JSON.stringify(S))}catch(e){}sync()};
const L=(a,e)=>S.lang=="ar"?a:e;
const dn=i=>DN[i][S.lang=="ar"?0:1];
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mn=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const f12=t=>{let[h,m]=t.split(":").map(Number);const p=h>=12?L("م","PM"):L("ص","AM");h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+p};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
let tt;function toast(s,bad){const t=document.getElementById("toast");t.textContent=s;t.className=bad?"bad":"";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3500)}
function op(h){document.getElementById("mb").innerHTML=h;document.getElementById("m").classList.add("on")}
function cl(){document.getElementById("m").classList.remove("on")}
const $=i=>document.getElementById(i);
function applyLook(){const r=document.documentElement;r.style.setProperty("--a",S.color);r.dir=S.lang=="ar"?"rtl":"ltr";r.lang=S.lang;if(S.theme=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
function R(){applyLook();$("sub").textContent=new Date().toLocaleDateString(S.lang=="ar"?"ar-LY":"en-GB",{weekday:"long",day:"numeric",month:"long"});$("ttl").textContent=view=="tt"?L("جدولي","My timetable"):L("امتحاناتي","My exams");
$("nv").innerHTML=`<button class="${view=="tt"?"on":""}" onclick="view='tt';R()">${L("الجدول","Timetable")}</button><button class="${view=="ex"?"on":""}" onclick="view='ex';R()">${L("امتحاناتي","Exams")}</button>`;
$("v").innerHTML=view=="tt"?TT():EX()}
function rows(){const m=new Map();S.slots.forEach(s=>m.set(s.join("|"),s));S.courses.forEach(c=>c.lec.forEach(l=>m.set(l.s+"|"+l.e,[l.s,l.e])));return[...m.values()].sort((a,b)=>mn(a[0])-mn(b[0])||mn(a[1])-mn(b[1]))}
function TT(){const rs=rows(),td0=(new Date().getDay()+1)%7;
let h=`<div class="tw"><table><tr><th></th>${rs.map(r=>`<th class="tc">${f12(r[0])}<br><span>${f12(r[1])}</span></th>`).join("")}</tr>`;
S.days.forEach(d=>{h+=`<tr><td class="t ${d==td0?"today":""}">${dn(d)}</td>`;rs.forEach(r=>{let c="";S.courses.forEach(x=>x.lec.forEach(l=>{if(l.d==d&&l.s==r[0]&&l.e==r[1])c+=`<div class="c" style="--cc:${cc(x)}" onclick="cm('${x.id}')">${E(x.name)}${x.hall?`<small>${E(x.hall)}</small>`:""}</div>`}));h+=`<td class="${d==td0?"today":""}">${c}</td>`});h+="</tr>"});
h+="</table></div>";
h+=S.courses.length?`<h3>${L("موادي","My courses")}</h3>`+S.courses.map(x=>`<div class="card cr" style="--cc:${cc(x)}" onclick="cm('${x.id}')"><b>${E(x.name)}</b><div class="mut">${[x.code,x.hall].filter(Boolean).map(t=>E(t)).join(" · ")}</div><div class="mut">${x.lec.map(l=>dn(l.d)+" "+f12(l.s)).join(" ، ")}</div></div>`).join(""):`<p class="mut">${L("الجدول فارغ. اضغط + لإضافة مادة.","Your timetable is empty. Tap + to add a course.")}</p>`;
return h+`<button class="fab" onclick="cf()" aria-label="+">+</button>`}
function cm(i){const c=S.courses.find(x=>x.id==i);op(`<h2>${E(c.name)}</h2><p class="mut">${c.code?E(c.code)+" · ":""}${c.hall?E(c.hall):""}${c.mid?`<br>${L("الجزئي","Midterm")}: ${c.mid}`:""}${c.fin?`<br>${L("النهائي","Final")}: ${c.fin}`:""}</p><div class="row"><button class="btn" onclick="cf('${i}')">${L("تعديل","Edit")}</button><button class="btn d" onclick="del('${i}')">${L("حذف","Delete")}</button><button class="btn g" onclick="cl()">${L("إغلاق","Close")}</button></div>`)}
function del(i){if(!confirm(L("حذف هذه المادة؟","Delete this course?")))return;S.courses=S.courses.filter(x=>x.id!=i);save();cl();R()}
function slotOpts(sel){return S.slots.map(s=>`<option value="${s.join("|")}" ${sel==s.join("|")?"selected":""}>${f12(s[0])} - ${f12(s[1])}</option>`).join("")+`<option value="">${L("وقت مخصص","Custom")}</option>`}
function lecRow(i,l){l=l||{d:S.days[0],s:S.slots[0]?.[0]||"08:30",e:S.slots[0]?.[1]||"10:00"};const all=[0,1,2,3,4,5,6];
return`<div class="lec" data-l><b class="mut">${L("محاضرة","Lecture")} ${i+1}</b><label>${L("اليوم","Day")}</label><select class="ld">${all.map(d=>`<option value="${d}" ${l.d==d?"selected":""}>${dn(d)}</option>`).join("")}</select>
<label>${L("الفترة","Slot")}</label><select onchange="if(this.value){const p=this.value.split('|'),r=this.closest('[data-l]');tpSet(r.querySelector('.ls'),p[0]);tpSet(r.querySelector('.le'),p[1])}">${slotOpts(l.s+"|"+l.e)}</select>
<label>${L("من","From")}</label>${TPH("ls","",l.s)}<label>${L("إلى","To")}</label>${TPH("le","",l.e)}</div>`}

const fired=new Set();function ntf(t,b){toast("🔔 "+t+" — "+b);try{if("Notification"in window&&Notification.permission=="granted")new Notification(t,{body:b})}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}

t=t.replace(d[0],"");const tm=[...t.matchAll(/(\d{1,2})[:.](\d{2})/g)];if(!tm.length)return bad.push(code+": "+L("الوقت غير واضح","time unclear")+" — "+r);

function webSVG(){let p="";const A=12;for(let i=0;i<A;i++){const a=i*2*Math.PI/A;p+="M50 50L"+(50+90*Math.cos(a)).toFixed(1)+" "+(50+90*Math.sin(a)).toFixed(1)}
